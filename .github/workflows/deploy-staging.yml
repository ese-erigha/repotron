name: Deploy Staging

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/gateway/**'
      - 'apps/pipeline/**'
      - 'apps/indexer/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply database migrations?"
        required: true
        type: boolean
        default: true
      force_deploy_gateway:
        description: "Deploy the gateway Worker even when gateway files did not change?"
        required: false
        type: boolean
        default: false
      force_deploy_pipeline:
        description: "Deploy the pipeline Worker even when pipeline files did not change?"
        required: false
        type: boolean
        default: false

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    name: Detect changes
    outputs:
      migrations: ${{ steps.changes.outputs.migrations }}
      gateway: ${{ steps.changes.outputs.gateway }}
      pipeline: ${{ steps.changes.outputs.pipeline }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "migrations=${{ inputs.apply_migrations }}" >> $GITHUB_OUTPUT
            echo "gateway=${{ inputs.force_deploy_gateway }}" >> $GITHUB_OUTPUT
            echo "pipeline=${{ inputs.force_deploy_pipeline }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
            echo "migrations=true" >> $GITHUB_OUTPUT
            echo "gateway=true" >> $GITHUB_OUTPUT
            echo "pipeline=true" >> $GITHUB_OUTPUT
            echo "First push to branch — will run applicable jobs"
            exit 0
          fi

          changed_files=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }})

          if echo "$changed_files" | grep -qE '^infra/migrations/.*\.sql$'; then
            echo "migrations=true" >> $GITHUB_OUTPUT
          else
            echo "migrations=false" >> $GITHUB_OUTPUT
          fi

          if echo "$changed_files" | grep -qE '^(apps/gateway/|packages/|pnpm-lock\.yaml|\.github/workflows/deploy-staging\.yml)'; then
            echo "gateway=true" >> $GITHUB_OUTPUT
          else
            echo "gateway=false" >> $GITHUB_OUTPUT
          fi

          if echo "$changed_files" | grep -qE '^(apps/pipeline/|apps/indexer/|packages/|pnpm-lock\.yaml|\.github/workflows/deploy-staging\.yml)'; then
            echo "pipeline=true" >> $GITHUB_OUTPUT
          else
            echo "pipeline=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test, and build
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  migrate:
    runs-on: ubuntu-latest
    name: Apply database migrations
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure the D1 database exists
        id: database
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          database_id=$(pnpm exec cf d1 list --name repotron-staging-db | jq -r '.[] | select(.name == "repotron-staging-db") | .uuid')
          if [ -z "$database_id" ]; then
            echo "Create D1 repotron-staging-db with cf, as in docs/phase-1-plan.md, section 7."
            exit 1
          fi
          echo "id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Apply migrations
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf d1 migrations apply "${{ steps.database.outputs.id }}" --dir ../../infra/migrations

  ensure-resources:
    runs-on: ubuntu-latest
    name: Ensure CI resources
    needs: [test, detect-changes, migrate]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create missing R2, Vectorize, and AI Gateway resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec bash scripts/ensure-resources-staging.sh

  deploy-pipeline:
    runs-on: ubuntu-latest
    name: Deploy pipeline
    needs: [detect-changes, test, migrate, ensure-resources]
    if: |
      always() &&
      needs.detect-changes.outputs.pipeline == 'true' &&
      needs.test.result == 'success' &&
      needs.ensure-resources.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy pipeline to Cloudflare Workers
        working-directory: apps/pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec cf deploy --force --message "${{ github.sha }}"

  deploy-gateway:
    runs-on: ubuntu-latest
    name: Deploy gateway
    needs: [detect-changes, test, migrate, ensure-resources, deploy-pipeline]
    if: |
      always() &&
      needs.detect-changes.outputs.gateway == 'true' &&
      needs.test.result == 'success' &&
      needs.ensure-resources.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.deploy-pipeline.result == 'success' || needs.deploy-pipeline.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy gateway to Cloudflare Workers
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Worker record can 404 for a few seconds after the first upload.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if pnpm exec cf deploy --force --message "${{ github.sha }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done

  summary:
    runs-on: ubuntu-latest
    name: Staging summary
    needs: [detect-changes, test, migrate, ensure-resources, deploy-pipeline, deploy-gateway]
    if: always()
    steps:
      - name: Workflow summary
        run: |
          echo "## Staging summary"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "- Checks: FAILED"
            exit 1
          fi
          echo "- Checks: SUCCESS"

          if [ "${{ needs.ensure-resources.result }}" != "success" ]; then
            echo "- CI resources: FAILED"
            exit 1
          fi
          echo "- CI resources: SUCCESS"

          if [ "${{ needs.detect-changes.outputs.migrations }}" == "true" ] && [ "${{ needs.migrate.result }}" != "success" ]; then
            echo "- Database migrations: FAILED"
            exit 1
          fi
          echo "- Database migrations: ${{ needs.migrate.result }}"

          if [ "${{ needs.detect-changes.outputs.pipeline }}" == "true" ] && [ "${{ needs.deploy-pipeline.result }}" != "success" ]; then
            echo "- Pipeline deploy: FAILED"
            exit 1
          fi
          echo "- Pipeline deploy: ${{ needs.deploy-pipeline.result }}"

          if [ "${{ needs.detect-changes.outputs.gateway }}" == "true" ] && [ "${{ needs.deploy-gateway.result }}" != "success" ]; then
            echo "- Gateway deploy: FAILED"
            exit 1
          fi
          echo "- Gateway deploy: ${{ needs.deploy-gateway.result }}"

          echo "- Migrations requested: ${{ needs.detect-changes.outputs.migrations }}"
          echo "- Gateway changes: ${{ needs.detect-changes.outputs.gateway }}"
          echo "- Pipeline changes: ${{ needs.detect-changes.outputs.pipeline }}"
