name: Deploy Web

on:
  push:
    branches:
      - develop
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test, and build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build --filter=web...

  deploy:
    runs-on: ubuntu-latest
    name: Deploy web
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=web...
      - name: Deploy web to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The Worker record can 404 for a few seconds after the first upload.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if pnpm exec cf deploy --message "${{ github.sha }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
            attempt=$((attempt + 1))
          done
