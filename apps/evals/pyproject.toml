[project]
name = "evals"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "deepeval",
  "httpx",
  "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.hatch.build.targets.wheel.sources]
"src/evals" = "evals"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["evals"]

[[tool.mypy.overrides]]
module = ["yaml", "deepeval", "deepeval.*"]
ignore_missing_imports = true
